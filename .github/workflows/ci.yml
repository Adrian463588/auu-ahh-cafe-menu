name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Quality and security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install checksum-pinned security tools
        run: npm run tools:install
      - name: Validate workflow syntax and script safety
        run: npm run lint:workflows
      - name: Lint with zero warnings
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and artifact-integrity tests
        run: npm test
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=low
      - name: Build without deployment credentials
        run: npm run build
      - name: Bind release files to the source commit
        run: npm run release
      - name: Scan history, current source and public artifacts
        run: npm run security:secrets
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser, offline and accessibility gates
        run: npm run test:e2e
      - name: Save the tested release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-release-${{ github.sha }}
          path: |
            out/
            build-manifest.json
          if-no-files-found: error
          retention-days: 3
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    name: Publish verified artifact to Vercel Hobby
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      production_url: ${{ steps.publish.outputs.production_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-release-${{ github.sha }}
          path: .
      - name: Verify hashes, latest main and free plan; publish without rebuilding
        id: publish
        run: node scripts/deploy.mjs --prebuilt
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}

  smoke:
    name: Check the published service
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: ${{ needs.deploy.outputs.production_url }}
      TEST_BASE_URL: ${{ needs.deploy.outputs.production_url }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check HTTPS, commit, catalog, headers, PDF and private paths
        run: npm run smoke
      - name: Install locked browser-test dependencies
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise the real cashier order flow in production
        run: npm run test:e2e -- --grep "real catalog order"
      - name: Save service verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-proof-${{ github.sha }}
          path: |
            evidence/smoke.json
            test-results/
          if-no-files-found: ignore
          retention-days: 3
