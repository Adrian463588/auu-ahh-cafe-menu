name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Quality and security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install checksum-pinned security tools
        run: npm run tools:install
      - name: Validate workflow syntax and script safety
        run: npm run lint:workflows
      - name: Lint with zero warnings
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and artifact-integrity tests
        run: npm test
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=low
      - name: Build without deployment credentials
        run: npm run build
      - name: Bind release files to the source commit
        run: npm run release
      - name: Scan history, current source and public artifacts
        run: npm run security:secrets
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser, offline and accessibility gates
        run: npm run test:e2e
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
