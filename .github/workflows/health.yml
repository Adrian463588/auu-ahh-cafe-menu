name: Service health

on:
  schedule:
    - cron: "17 0 * * *" # 07:17 WIB; avoids the busiest minute of the hour.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-health
  cancel-in-progress: true

jobs:
  probe:
    name: Daily production probe
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Measure and verify the public service without secrets
        run: npm run smoke
        env:
          SITE_URL: https://auu-ahh-cafe-menu.vercel.app
          EXPECTED_COMMIT: ${{ github.sha }}
      - name: Save the actual probe result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-${{ github.run_id }}
          path: evidence/smoke.json
          if-no-files-found: ignore
          retention-days: 7
